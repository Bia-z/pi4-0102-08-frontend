server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Repassa as chamadas /api para o backend.
    # Assim o navegador fala só com localhost:3000 e não há problema de CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}