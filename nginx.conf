server {
    # Escuta na porta 80
    listen 80;

    # Pasta onde estão os arquivos do site
    root /usr/share/nginx/html;

    # Página inicial
    index index.html;

    location / {
        # Tenta achar o arquivo pedido; se não existir, devolve erro 404
        try_files $uri $uri/ =404;
    }
}