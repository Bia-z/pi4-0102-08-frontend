<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Cozinha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            nav, #status-comandas, #titulo-cozinha { display: none !important; }
            main { max-width: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body>
<nav class="navbar bg-body-tertiary px-3">
    <span class="navbar-brand mb-0 h1">RestManager · Cozinha</span>
    <div>
        <span id="usuario" class="me-3 text-secondary"></span>
        <button id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <h1 id="titulo-cozinha" class="h4">Área: Cozinha</h1>
    <p id="status-comandas" class="text-secondary" role="status" aria-live="polite">
        Conectando às comandas...
    </p>
    <section id="visualizacao-comanda" class="card card-body" aria-live="polite"></section>
</main>

<script type="importmap">
    {
        "imports": {
            "@stomp/stompjs": "https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/esm6/index.js"
        }
    }
</script>
<script type="module">
    import { iniciarPagina } from '/assets/js/core/guard.js';
    import { iniciarComandasCozinha } from '/cozinha/js/comandas.js';
    if (iniciarPagina('cozinha')) {
        try {
            await iniciarComandasCozinha();
        } catch (erro) {
            document.getElementById('status-comandas').textContent =
                `Conexão das comandas indisponível: ${erro.message}`;
        }
    }
</script>
</body>
</html>
