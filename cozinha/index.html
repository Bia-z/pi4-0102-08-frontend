<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Cozinha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            nav, #status-comandas, #titulo-cozinha, #painel-cozinha { display: none !important; }
            main { max-width: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body>
<nav class="navbar bg-body-tertiary px-3">
    <span class="navbar-brand mb-0 h1">RestManager · Cozinha</span>
    <div>
        <span id="usuario" class="me-3 text-secondary"></span>
        <button id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <h1 id="titulo-cozinha" class="h4">Área: Cozinha</h1>
    <section id="painel-cozinha" class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h2 class="h5 mb-0">Pedidos em aberto</h2>
            <button type="button" id="atualizar" class="btn btn-outline-primary btn-sm">Atualizar</button>
        </div>
        <p id="status-conexao" class="small text-secondary" role="status" aria-live="polite">Conectando aos pedidos...</p>
        <div id="pedidos-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
        <div id="pedidos-vazio" class="alert alert-info d-none" role="status">Não há pedidos em aberto.</div>
        <div id="pedidos" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" aria-live="polite"></div>
    </section>
    <p id="status-comandas" class="text-secondary" role="status" aria-live="polite">
        Conectando às comandas...
    </p>
    <section id="visualizacao-comanda" class="card card-body" aria-live="polite"></section>
</main>

<script type="importmap">
    {
        "imports": {
            "@stomp/stompjs": "https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/esm6/index.js"
        }
    }
</script>
<script type="module">
    import { iniciarPagina } from '/assets/js/core/guard.js';
    import { iniciarComandasCozinha } from '/cozinha/js/comandas.js';
    import { inicializarPainelCozinha } from '/cozinha/js/painel.js';
    if (iniciarPagina('cozinha')) {
        inicializarPainelCozinha();
        try {
            await iniciarComandasCozinha();
        } catch (erro) {
            document.getElementById('status-comandas').textContent =
                `Conexão das comandas indisponível: ${erro.message}`;
        }
    }
</script>
</body>
</html>
