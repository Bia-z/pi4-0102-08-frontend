<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Itens do cardápio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/admin/funcionarios.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Administrador</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a class="nav-link" href="/admin/funcionarios.html">Funcionários</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="/admin/itens.html">Itens</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/mesas.html">Mesas</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-1">Itens do cardápio</h1>
            <p class="text-secondary mb-0">Cadastre, edite e desative os itens vendidos no restaurante.</p>
        </div>
        <a class="btn btn-primary" href="/admin/prato-form.html">Cadastrar item</a>
    </div>

    <div id="lista-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

    <div class="table-responsive card shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Categoria</th>
                <th scope="col">Preço</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody id="corpo-itens"></tbody>
        </table>
    </div>
    <p class="form-text mt-2">Desativar um item o tira do cardápio, mas mantém o histórico dos pedidos antigos.</p>
</main>

<script type="module" src="/admin/js/itens.js"></script>
</body>
</html>
