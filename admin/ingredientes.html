<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Ingredientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-body-tertiary px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="/admin/funcionarios.html">RestManager · Administrador</a>
    <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/admin/funcionarios.html">Funcionários</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/itens.html">Itens</a></li>
        <li class="nav-item"><a class="nav-link active" href="/admin/ingredientes.html">Ingredientes</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/mesa-form.html">Mesas</a></li>
    </ul>
    <div>
        <span id="usuario" class="me-3 text-secondary"></span>
        <button id="btn-sair" class="btn btn-outline-secondary btn-sm" type="button">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="h4 mb-1">Ingredientes</h2>
            <p class="text-secondary mb-0">Cadastre, edite e desative os ingredientes usados nos itens.</p>
        </div>
        <a class="btn btn-primary" href="/admin/ingrediente-form.html">Cadastrar ingrediente</a>
    </div>

    <div id="lista-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

    <div class="table-responsive card shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody id="corpo-ingredientes"></tbody>
        </table>
    </div>
    <p class="form-text mt-2">Um ingrediente desativado não aparece para novos itens, mas continua nos itens que já o usam.</p>
</main>

<script type="module" src="/admin/js/ingredientes.js"></script>
</body>
</html>
