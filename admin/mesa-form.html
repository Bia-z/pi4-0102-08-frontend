<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Cadastrar mesa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/admin/funcionarios.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Administrador</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a class="nav-link" href="/admin/funcionarios.html">Funcionários</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/itens.html">Itens</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="/admin/mesa-form.html">Mesas</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <a href="/admin/funcionarios.html" class="link-secondary d-inline-block mb-2">Voltar para administração</a>
            <h1 class="h3 mb-3">Cadastrar mesa</h1>

            <div id="mesa-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
            <div id="mesa-sucesso" class="alert alert-success d-none" role="status" aria-live="polite"></div>

            <form id="form-mesa" class="card card-body shadow-sm" novalidate>
                <div class="mb-3">
                    <label for="numero" class="form-label">Número da mesa</label>
                    <input id="numero" name="numero" class="form-control" type="number" min="1" step="1" required aria-describedby="numero-erro">
                    <div id="numero-erro" class="invalid-feedback"></div>
                </div>
                <div class="mb-4">
                    <label for="capacidade" class="form-label">Capacidade</label>
                    <input id="capacidade" name="capacidade" class="form-control" type="number" min="1" step="1" required aria-describedby="capacidade-erro">
                    <div id="capacidade-erro" class="invalid-feedback"></div>
                </div>
                <button id="btn-cadastrar-mesa" class="btn btn-primary" type="submit">Cadastrar mesa</button>
            </form>
        </div>
    </div>
</main>

<script type="module" src="/admin/js/mesa-form.js"></script>
</body>
</html>
