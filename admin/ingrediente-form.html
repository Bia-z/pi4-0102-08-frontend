<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Cadastrar ingrediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap bg-body-tertiary px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="/admin/funcionarios.html">RestManager · Administrador</a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a class="nav-link" href="/admin/funcionarios.html">Funcionários</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/itens.html">Itens</a></li>
        <li class="nav-item"><a class="nav-link active" href="/admin/ingredientes.html">Ingredientes</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/mesa-form.html">Mesas</a></li>
    </ul>
    <div>
        <span id="usuario" class="me-3 text-secondary"></span>
        <button id="btn-sair" class="btn btn-outline-secondary btn-sm" type="button">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <a href="/admin/ingredientes.html" class="link-secondary">Voltar para ingredientes</a>
            <h1 id="titulo-pagina" class="h3 mt-3 mb-4">Cadastrar ingrediente</h1>

            <div id="ingrediente-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
            <div id="ingrediente-sucesso" class="alert alert-success d-none" role="status" aria-live="polite"></div>

            <form id="form-ingrediente" class="card card-body shadow-sm" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input id="nome" name="nome" class="form-control" type="text" maxlength="80" required aria-describedby="nome-erro">
                    <div id="nome-erro" class="invalid-feedback"></div>
                </div>
                <div id="grupo-ativo" class="form-check mb-4 d-none">
                    <input id="ativo" name="ativo" class="form-check-input" type="checkbox" checked>
                    <label for="ativo" class="form-check-label">Ingrediente ativo (pode ser usado em novos itens)</label>
                </div>
                <button id="btn-salvar" class="btn btn-primary" type="submit">Cadastrar ingrediente</button>
            </form>
        </div>
    </div>
</main>

<script type="module" src="/admin/js/ingrediente-form.js"></script>
</body>
</html>
