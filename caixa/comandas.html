<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Comandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/caixa/index.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Caixa</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a id="voltar-caixa" aria-label="Voltar à página anterior" class="nav-link" href="/caixa/index.html">← Voltar</a></li>
        <li class="nav-item"><a class="nav-link" href="/caixa/index.html">Início</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Consulta de comanda</h1>
    <form id="form-comanda" class="row g-2 align-items-end mb-3">
        <div class="col-auto"><label for="pedido-id" class="form-label">Pedido</label><input id="pedido-id" class="form-control" type="text" required></div>
        <div class="col-auto"><button class="btn btn-primary" type="submit">Consultar</button></div>
        <div class="col-auto"><button id="baixar-comanda" class="btn btn-outline-primary" type="button" disabled>Baixar / abrir PDF</button></div>
    </form>
    <p id="erro-comanda" class="alert alert-danger" role="alert" hidden></p>
    <section id="visualizacao-comanda" class="card card-body" aria-live="polite"></section>
</main>
<script type="module">
    import { iniciarPaginaCaixa } from '/assets/js/core/guard.js';
    import { inicializarComandas } from '/caixa/js/comandas.js';
    if (await iniciarPaginaCaixa()) inicializarComandas();
</script>
</body>
</html>
