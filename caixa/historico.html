<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Histórico de caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-body-tertiary px-3">
    <a class="navbar-brand" href="/caixa/index.html">RestManager · Caixa</a>
    <div><span id="usuario" class="me-3 text-secondary"></span><button id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair</button></div>
</nav>
<main class="container py-4">
    <h1 class="h3">Histórico de turnos</h1>
    <p id="erro-caixa" class="alert alert-danger" role="alert" hidden></p>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>Turno</th><th>Abertura</th><th>Fechamento</th><th>Valor inicial</th><th>Valor contado</th></tr></thead>
            <tbody id="historico-caixa"><tr><td colspan="5">Carregando histórico...</td></tr></tbody>
        </table>
    </div>
</main>
<script type="module">
    import { iniciarPaginaPerfis } from '/assets/js/core/guard.js';
    import { carregarHistorico } from '/caixa/js/historico.js';
    if (iniciarPaginaPerfis(['ADMIN', 'CAIXA'])) await carregarHistorico();
</script>
</body>
</html>
