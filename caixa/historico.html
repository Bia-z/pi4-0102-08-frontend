<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Histórico de caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3 d-print-none">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/caixa/index.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Caixa</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a id="voltar-caixa" aria-label="Voltar à página anterior" class="nav-link" href="/caixa/index.html">← Voltar</a></li>
        <li class="nav-item"><a class="nav-link" href="/caixa/index.html">Início</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>
<main class="container py-4 d-print-none">
    <h1 class="h3 mb-3">Histórico de turnos</h1>
    <p id="erro-caixa" class="alert alert-danger" role="alert" hidden></p>
    <div class="row g-2 align-items-end mb-3">
        <div class="col-sm-5 col-md-4">
            <label for="data-fechamento" class="form-label">Data de fechamento</label>
            <input id="data-fechamento" class="form-control" type="date">
        </div>
        <div class="col-auto">
            <button id="limpar-filtro-data" class="btn btn-outline-secondary" type="button">Limpar filtro</button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>Turno</th><th>Abertura</th><th>Fechamento</th><th>Valor inicial</th><th>Valor contado</th><th>Ações</th></tr></thead>
            <tbody id="historico-caixa"><tr><td colspan="6">Carregando histórico...</td></tr></tbody>
        </table>
    </div>
</main>
<section id="area-impressao" class="d-none d-print-block p-3"></section>
<script type="module">
    import { iniciarPaginaCaixa } from '/assets/js/core/guard.js';
    import { carregarHistorico } from '/caixa/js/historico.js';
    if (await iniciarPaginaCaixa()) await carregarHistorico();
</script>
</body>
</html>
