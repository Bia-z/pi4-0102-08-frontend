<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-body-tertiary px-3">
    <span class="navbar-brand mb-0 h1">RestManager · Caixa</span>
    <div>
        <span id="usuario" class="me-3 text-secondary"></span>
        <button id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair</button>
    </div>
</nav>

<main class="container py-4">
    <h2 class="h4">Área: Caixa</h2>
    <section aria-labelledby="titulo-mapa-mesas">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 id="titulo-mapa-mesas" class="h5 mb-0">Mapa de mesas</h3>
            <button type="button" id="atualizar-mesas" class="btn btn-outline-primary btn-sm">Atualizar mesas</button>
        </div>
        <div id="mapa-mesas" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3" aria-live="polite"></div>
        <p id="status-mesas-tempo-real" class="small text-secondary mt-3" role="status" aria-live="polite"></p>
    </section>
</main>

<script type="importmap">
    {
        "imports": {
            "@stomp/stompjs": "https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/esm6/index.js"
        }
    }
</script>
<script type="module">
    import { iniciarPagina } from '/assets/js/core/guard.js';
    import { carregarMapaMesas, inicializarMapaMesas } from '/assets/js/core/mapa-mesas.js';
    import { conectarAtualizacoesMesas } from '/assets/js/core/ws.js';

    if (iniciarPagina('caixa')) {
        inicializarMapaMesas();
        const status = document.getElementById('status-mesas-tempo-real');

        try {
            const cliente = await conectarAtualizacoesMesas({
                aoConectar: () => { status.textContent = 'Atualizações em tempo real conectadas.'; },
                aoAtualizar: () => carregarMapaMesas(),
                aoErro: (erro) => { status.textContent = `Atualizações em tempo real indisponíveis: ${erro.message}`; },
            });
            window.addEventListener('pagehide', () => cliente.deactivate());
        } catch (erro) {
            status.textContent = `Atualizações em tempo real indisponíveis: ${erro.message}`;
        }
    }
</script>
</body>
</html>
