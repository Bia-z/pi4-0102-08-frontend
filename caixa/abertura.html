<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Abertura do caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/caixa/index.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Caixa</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a id="voltar-caixa" aria-label="Voltar à página anterior" class="nav-link" href="/caixa/index.html">← Voltar</a></li>
        <li class="nav-item"><a class="nav-link" href="/caixa/index.html">Início</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Abertura de turno</h1>
    <p id="status-caixa" class="text-secondary" role="status" aria-live="polite">Carregando...</p>
    <p id="erro-caixa" class="alert alert-danger" role="alert" aria-live="assertive" hidden></p>
    <p id="sucesso-caixa" class="alert alert-success" role="status" hidden></p>
    <button id="tentar-novamente" class="btn btn-outline-primary mb-3" type="button" hidden>
        Tentar consultar novamente
    </button>
    <form id="form-abertura" class="card card-body col-md-6" hidden>
        <label for="turno" class="form-label">Turno</label>
        <select id="turno" class="form-select mb-3" required>
            <option value="MANHA">Manhã</option><option value="TARDE">Tarde</option><option value="NOITE">Noite</option>
        </select>
        <label for="valor-abertura" class="form-label">Valor de fundo de caixa (R$)</label>
        <input id="valor-abertura" class="form-control mb-3" type="text" inputmode="decimal"
               placeholder="0,00" autocomplete="off" required>
        <button id="abrir-turno" class="btn btn-primary" type="submit">Abrir turno</button>
    </form>
</main>
<script type="module">
    import { iniciarPaginaPerfis } from '/assets/js/core/guard.js';
    import { inicializarAbertura } from '/caixa/js/abertura.js';
    const sessao = iniciarPaginaPerfis(['ADMIN', 'CAIXA']);
    if (sessao) {
        const perfilCaixa = String(sessao.perfil).toUpperCase() === 'CAIXA';
        const fluxoLogin = new URLSearchParams(window.location.search).get('login') === '1';
        if (fluxoLogin) window.history.replaceState(null, '', '/caixa/abertura.html');
        await inicializarAbertura({
            fluxoLogin: perfilCaixa && fluxoLogin,
            redirecionarAposAbertura: perfilCaixa,
        });
    }
</script>
</body>
</html>
