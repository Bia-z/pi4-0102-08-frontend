<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Movimentações de caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-body-tertiary px-3">
    <a class="navbar-brand" href="/caixa/index.html">RestManager · Caixa</a>
    <div><span id="usuario" class="me-3 text-secondary"></span><button id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair</button></div>
</nav>
<main class="container py-4">
    <h1 class="h3">Sangria e reforço</h1>
    <p id="erro-movimentacao" class="alert alert-danger" role="alert" hidden></p>
    <p id="sucesso-movimentacao" class="alert alert-success" role="status" hidden></p>
    <form id="form-movimentacao" class="card card-body col-md-6 mb-4">
        <label for="tipo" class="form-label">Tipo</label>
        <select id="tipo" class="form-select mb-3" required>
            <option value="SANGRIA">Sangria</option><option value="REFORCO">Reforço</option>
        </select>
        <label for="valor" class="form-label">Valor (R$)</label>
        <input id="valor" class="form-control mb-3" type="number" min="0.01" step="0.01" required>
        <label for="motivo" class="form-label">Motivo</label>
        <textarea id="motivo" class="form-control mb-3" maxlength="300" required></textarea>
        <button id="registrar-movimentacao" class="btn btn-primary" type="submit">Registrar movimentação</button>
    </form>
    <h2 class="h5">Movimentações registradas</h2>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>Data e hora</th><th>Tipo</th><th>Valor</th><th>Motivo</th></tr></thead>
            <tbody id="movimentacoes-caixa"><tr><td colspan="4">Carregando movimentações...</td></tr></tbody>
        </table>
    </div>
</main>
<script type="module">
    import { iniciarPaginaCaixa } from '/assets/js/core/guard.js';
    import { inicializarSangria } from '/caixa/js/sangria.js';
    if (await iniciarPaginaCaixa()) inicializarSangria();
</script>
</body>
</html>
