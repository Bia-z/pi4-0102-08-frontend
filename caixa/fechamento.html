<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Fechamento do caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/caixa/index.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Caixa</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a id="voltar-caixa" aria-label="Voltar à página anterior" class="nav-link" href="/caixa/index.html">← Voltar</a></li>
        <li class="nav-item"><a class="nav-link" href="/caixa/index.html">Início</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Fechamento de turno</h1>
    <p id="status-caixa" class="text-secondary" role="status" aria-live="polite">Carregando...</p>
    <p id="erro-caixa" class="alert alert-danger" role="alert" hidden></p>
    <button id="recarregar-fechamento" class="btn btn-outline-primary mb-3" type="button" hidden>
        Tentar carregar novamente
    </button>
    <section id="resumo-vendas" class="card mb-4" hidden aria-labelledby="titulo-resumo-vendas">
        <div class="card-body">
            <h2 id="titulo-resumo-vendas" class="h5">Resumo das vendas de hoje</h2>
            <p>Valor de abertura do caixa: <strong id="fechamento-valor-abertura"></strong></p>
            <p>Total recebido: <strong id="fechamento-total-recebido"></strong></p>
            <dl class="row mb-0">
                <dt class="col-7">Dinheiro</dt><dd id="fechamento-total-dinheiro" class="col-5 text-end"></dd>
                <dt class="col-7">Crédito</dt><dd id="fechamento-total-credito" class="col-5 text-end"></dd>
                <dt class="col-7">Débito</dt><dd id="fechamento-total-debito" class="col-5 text-end"></dd>
                <dt class="col-7">Pix</dt><dd id="fechamento-total-pix" class="col-5 text-end"></dd>
                <dt class="col-7">Vale-alimentação</dt><dd id="fechamento-total-vale" class="col-5 text-end"></dd>
                <dt class="col-7">Quantidade de pagamentos</dt>
                <dd id="fechamento-quantidade-pagamentos" class="col-5 text-end"></dd>
            </dl>
        </div>
    </section>
    <form id="form-fechamento" class="card card-body col-md-6" hidden>
        <label for="valor-fechamento" class="form-label">Valor contado no caixa (R$)</label>
        <input id="valor-fechamento" class="form-control mb-3" type="text" inputmode="decimal"
               placeholder="0,00" autocomplete="off" required>
        <label for="codigo-usuario" class="form-label">Código da pessoa que autoriza</label>
        <input id="codigo-usuario" class="form-control mb-3" type="text" autocomplete="username" required>
        <label for="senha-autorizacao" class="form-label">Senha da pessoa que autoriza</label>
        <input id="senha-autorizacao" class="form-control mb-3" type="password"
               autocomplete="current-password" required>
        <button id="fechar-turno" class="btn btn-primary" type="submit">Fechar turno</button>
    </form>
    <section id="resultado-fechamento" class="card mt-4" hidden aria-live="polite">
        <div class="card-body">
            <h2 class="h5">Resultado do fechamento</h2>
            <dl class="row mb-0">
                <dt class="col-7">Valor esperado</dt><dd id="valor-esperado" class="col-5 text-end"></dd>
                <dt class="col-7">Valor contado</dt><dd id="valor-contado" class="col-5 text-end"></dd>
                <dt class="col-7">Diferença (<span id="tipo-diferenca"></span>)</dt>
                <dd id="diferenca" class="col-5 text-end fw-bold"></dd>
            </dl>
        </div>
    </section>
</main>
<script type="module">
    import { iniciarPaginaCaixa } from '/assets/js/core/guard.js';
    import { inicializarFechamento } from '/caixa/js/fechamento.js';
    const sessao = await iniciarPaginaCaixa();
    if (sessao) await inicializarFechamento({ perfil: sessao.perfil });
</script>
</body>
</html>
