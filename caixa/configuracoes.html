<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Configurações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/caixa/index.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Caixa</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a id="voltar-caixa" aria-label="Voltar à página anterior" class="nav-link" href="/caixa/index.html">← Voltar</a></li>
        <li class="nav-item"><a class="nav-link" href="/caixa/index.html">Início</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Configurações do restaurante</h1>
    <p id="erro-configuracoes" class="alert alert-danger" role="alert" hidden></p>
    <p id="sucesso-configuracoes" class="alert alert-success" role="status" hidden></p>
    <p id="somente-consulta" class="text-secondary" hidden>Seu perfil pode consultar, mas não alterar as configurações.</p>
    <form id="form-configuracoes" class="card card-body col-md-8" hidden>
        <label for="nome-restaurante" class="form-label">Nome do restaurante</label>
        <input id="nome-restaurante" class="form-control mb-3" type="text" required maxlength="120">
        <label for="taxa-servico" class="form-label">Taxa de serviço (%)</label>
        <input id="taxa-servico" class="form-control mb-3" type="number" min="0" max="100" step="0.01" required>
        <div class="form-check mb-3">
            <input id="taxa-servico-ativa" class="form-check-input" type="checkbox">
            <label for="taxa-servico-ativa" class="form-check-label">Cobrar taxa de serviço</label>
        </div>
        <div class="form-check mb-2">
            <input id="imprimir-comanda" class="form-check-input" type="checkbox">
            <label for="imprimir-comanda" class="form-check-label">Imprimir comanda na cozinha ao aceitar item</label>
        </div>
        <div class="form-check mb-2">
            <input id="comanda-unica" class="form-check-input" type="checkbox">
            <label for="comanda-unica" class="form-check-label">Imprimir todos os pratos do pedido em uma comanda só</label>
        </div>
        <div class="form-check mb-3">
            <input id="imprimir-comprovante" class="form-check-input" type="checkbox">
            <label for="imprimir-comprovante" class="form-check-label">Imprimir comprovante automaticamente ao fechar a conta</label>
        </div>
        <button id="salvar-configuracoes" class="btn btn-primary" type="submit">Salvar configurações</button>
    </form>
</main>
<script type="module">
    import { iniciarPaginaCaixa } from '/assets/js/core/guard.js';
    import { inicializarConfiguracoes } from '/caixa/js/configuracoes.js';
    const sessao = await iniciarPaginaCaixa();
    if (sessao) await inicializarConfiguracoes({ perfil: sessao.perfil });
</script>
</body>
</html>
