<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Relatórios do caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-body-tertiary px-3">
    <a class="navbar-brand" href="/caixa/index.html">RestManager · Caixa</a>
    <div class="d-flex align-items-center gap-2 me-auto">
        <a id="voltar-caixa" class="btn btn-outline-secondary btn-sm" href="/caixa/index.html"
           aria-label="Voltar à página anterior">← Voltar</a>
        <a class="btn btn-outline-secondary btn-sm" href="/caixa/index.html" aria-label="Início do caixa">⌂ Início</a>
    </div>
    <div><span id="usuario" class="me-3 text-secondary"></span><button id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair</button></div>
</nav>
<main class="container py-4">
    <h1 class="h3">Relatório diário</h1>
    <form id="form-relatorio" class="row g-2 align-items-end mb-3">
        <div class="col-auto"><label for="data-relatorio" class="form-label">Data</label><input id="data-relatorio" class="form-control" type="date" required></div>
        <div class="col-auto"><button class="btn btn-primary" type="submit">Consultar</button></div>
        <div class="col-auto"><button id="baixar-relatorio" class="btn btn-outline-primary" type="button">Baixar / abrir PDF</button></div>
    </form>
    <p id="carregando-relatorio" class="text-secondary" role="status" hidden>Carregando relatório...</p>
    <p id="erro-relatorio" class="alert alert-danger" role="alert" hidden></p>
    <section id="resultado-relatorio" hidden>
        <h2 class="h5">Totais recebidos</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3 mb-4">
            <div class="col"><div class="card card-body">Dinheiro <strong id="total-dinheiro"></strong></div></div>
            <div class="col"><div class="card card-body">Crédito <strong id="total-credito"></strong></div></div>
            <div class="col"><div class="card card-body">Débito <strong id="total-debito"></strong></div></div>
            <div class="col"><div class="card card-body">Pix <strong id="total-pix"></strong></div></div>
            <div class="col"><div class="card card-body">Vale-alimentação <strong id="total-vale"></strong></div></div>
            <div class="col"><div class="card card-body">Quantidade de pagamentos <strong id="quantidade-pagamentos"></strong></div></div>
        </div>
        <h2 class="h5">Movimentações do dia</h2>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>Tipo</th><th>Motivo</th><th>Valor</th></tr></thead>
                <tbody id="movimentacoes-relatorio"></tbody>
            </table>
        </div>
    </section>
</main>
<script type="module">
    import { iniciarPaginaCaixa } from '/assets/js/core/guard.js';
    import { inicializarRelatorio } from '/caixa/js/relatorio.js';
    if (await iniciarPaginaCaixa()) inicializarRelatorio();
</script>
</body>
</html>
