<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestManager | Acompanhar pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    <link href="/assets/img/logo-marca.png" rel="icon" type="image/png">
</head>
<body>
<nav class="navbar navbar-expand flex-wrap px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/garcom/index.html"><img src="/assets/img/logo-marca.png" alt="RestManager" height="32"><span>Garçom</span></a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item"><a class="nav-link" href="/garcom/index.html">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="/garcom/cardapio.html">Cardápio</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="/garcom/acompanhamento.html">Acompanhar pedidos</a></li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span id="usuario" class="navbar-text"></span>
        <button id="btn-sair" class="btn btn-outline-light btn-sm" type="button">Sair</button>
    </div>
</nav>

<main id="pagina-acompanhamento" class="container py-4">
    <a href="/garcom/index.html" class="link-secondary d-inline-block mb-2">Voltar para a área do garçom</a>
    <div class="d-flex justify-content-between align-items-center mt-3 mb-1">
        <h1 class="h3 mb-0">Acompanhar pedidos</h1>
        <button type="button" id="atualizar" class="btn btn-outline-primary btn-sm">Atualizar</button>
    </div>
    <p id="status-conexao" class="small text-secondary" role="status" aria-live="polite">Conectando aos pedidos...</p>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="todos-garcons">
        <label class="form-check-label" for="todos-garcons">Mostrar pedidos de todos os garçons</label>
    </div>

    <div id="avisos-prontos" aria-live="polite"></div>
    <div id="pedidos-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
    <div id="pedidos-vazio" class="alert alert-info d-none" role="status">Não há pedidos em aberto.</div>
    <div id="pedidos" class="vstack gap-3"></div>
</main>

<script type="importmap">
    {
        "imports": {
            "@stomp/stompjs": "https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/esm6/index.js"
        }
    }
</script>
<script type="module" src="/garcom/js/acompanhamento.js"></script>
</body>
</html>
