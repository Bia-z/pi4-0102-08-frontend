<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RestManager | Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="pagina-login">
<main class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm w-100" style="max-width: 400px;">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-1">RestManager</h1>
      <p class="text-center text-secondary mb-4">Entre com seu código e senha</p>

      <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

      <form id="form-login">
        <div class="mb-3">
          <label for="codigo" class="form-label">Código de funcionário</label>
          <input type="text" id="codigo" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" id="senha" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-entrar" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</main>

<script type="module" src="/assets/js/core/login.js"></script>
</body>
</html>
